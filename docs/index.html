    <!-- GitHub Pages Single Page App (SPA) Support & Trailing Slash Fix -->
    <script type="text/javascript">
      // 1. Force trailing slash on directory URLs so relative paths (./assets/...) never 404
      (function() {
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var p = l.pathname;
          var last = p.split('/').filter(Boolean).pop() || '';
          if (!p.endsWith('/') && !last.includes('.')) {
            l.replace(p + '/' + l.search + l.hash);
          }
        }
      })();
    </script>
    <script type="text/javascript">
      // 2. Decode redirected query parameters from 404.html for GitHub Pages
      (function(l) {
        if (l.search && l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
            basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <div id="root"></div>
    <script>
      // 3. Fallback: If uncompiled source index.html is served directly on GitHub Pages (/root), redirect to /docs/ where the compiled bundle resides
      (function() {
        if (typeof window === 'undefined') return;
        var l = window.location;
        if (l.hostname.endsWith('github.io')) {
          var unbuiltScript = document.querySelector('script[src*="main.tsx"]');
          if (unbuiltScript && !l.pathname.includes('/docs/')) {
            var origin = l.origin || (l.protocol + '//' + l.host);
            var cleanPath = l.pathname.replace(/\/index\.html$/, '');
            if (!cleanPath.endsWith('/')) cleanPath += '/';
            window.location.replace(origin + cleanPath + 'docs/' + l.search + l.hash);
          }
        }
      })();
    </script>
