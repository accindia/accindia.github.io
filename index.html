    <script>
      // Fallback for static GitHub Pages if repository root is served instead of built assets
      if (typeof window !== 'undefined' && window.location.hostname.endsWith('github.io')) {
        var unbuiltScript = document.querySelector('script[src*="main.tsx"]');
        if (unbuiltScript && !window.location.pathname.includes('/docs/')) {
          var p = window.location.pathname;
          var target = p.endsWith('/') ? p + 'docs/' : p + '/docs/';
          window.location.replace(target + window.location.search + window.location.hash);
        }
      }
    </script>
